<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>Estrelas, lições e dias seguidos</title>
<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ECE8E2"/><stop offset="1" stop-color="#DCD6CD"/></linearGradient>
  <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C79A6B"/><stop offset="1" stop-color="#A97C51"/></linearGradient>
  <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBFAF7"/><stop offset="1" stop-color="#F1EEE8"/></linearGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity="0.28"/></filter>
  <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FDFDFB"/><stop offset="0.55" stop-color="#F1F1EE"/><stop offset="1" stop-color="#E2E2DE"/></linearGradient>
  <linearGradient id="skinSide" gradientUnits="userSpaceOnUse" x1="360" y1="0" x2="760" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0.35"/><stop offset="0.45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#7C7F88" stop-opacity="0.22"/></linearGradient>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="1280" height="720" fill="url(#paper)"/><text x="640" y="70" text-anchor="middle" font-size="40" font-weight="800" fill="#1F1F23">Estrelas, lições e dias seguidos</text><rect x="60" y="120" width="560" height="315" rx="24" fill="#fff" stroke="#E2DED6" stroke-width="2"/><text x="90" y="168" font-size="26" font-weight="800" fill="#1F1F23">Como ganhar estrelas</text><polygon points="120.0,202.0 124.8,213.4 137.1,214.4 127.7,222.5 130.6,234.6 120.0,228.1 109.4,234.6 112.3,222.5 102.9,214.4 115.2,213.4" fill="#F6C445" stroke-linejoin="round"/><polygon points="164.0,202.0 168.8,213.4 181.1,214.4 171.7,222.5 174.6,234.6 164.0,228.1 153.4,234.6 156.3,222.5 146.9,214.4 159.2,213.4" fill="#DAD6CE" stroke-linejoin="round"/><polygon points="208.0,202.0 212.8,213.4 225.1,214.4 215.7,222.5 218.6,234.6 208.0,228.1 197.4,234.6 200.3,222.5 190.9,214.4 203.2,213.4" fill="#DAD6CE" stroke-linejoin="round"/><text x="270" y="218" font-size="22" font-weight="700" fill="#1F1F23">Tocou guiado uma volta inteira</text><text x="270" y="244" font-size="19" fill="#5B5B66">sem errar a tecla</text><polygon points="120.0,272.0 124.8,283.4 137.1,284.4 127.7,292.5 130.6,304.6 120.0,298.1 109.4,304.6 112.3,292.5 102.9,284.4 115.2,283.4" fill="#F6C445" stroke-linejoin="round"/><polygon points="164.0,272.0 168.8,283.4 181.1,284.4 171.7,292.5 174.6,304.6 164.0,298.1 153.4,304.6 156.3,292.5 146.9,284.4 159.2,283.4" fill="#F6C445" stroke-linejoin="round"/><polygon points="208.0,272.0 212.8,283.4 225.1,284.4 215.7,292.5 218.6,304.6 208.0,298.1 197.4,304.6 200.3,292.5 190.9,284.4 203.2,283.4" fill="#DAD6CE" stroke-linejoin="round"/><text x="270" y="288" font-size="22" font-weight="700" fill="#1F1F23">Tocou de memória</text><text x="270" y="314" font-size="19" fill="#5B5B66">depois de errar ou com dica</text><polygon points="120.0,342.0 124.8,353.4 137.1,354.4 127.7,362.5 130.6,374.6 120.0,368.1 109.4,374.6 112.3,362.5 102.9,354.4 115.2,353.4" fill="#F6C445" stroke-linejoin="round"/><polygon points="164.0,342.0 168.8,353.4 181.1,354.4 171.7,362.5 174.6,374.6 164.0,368.1 153.4,374.6 156.3,362.5 146.9,354.4 159.2,353.4" fill="#F6C445" stroke-linejoin="round"/><polygon points="208.0,342.0 212.8,353.4 225.1,354.4 215.7,362.5 218.6,374.6 208.0,368.1 197.4,374.6 200.3,362.5 190.9,354.4 203.2,353.4" fill="#F6C445" stroke-linejoin="round"/><text x="270" y="358" font-size="22" font-weight="700" fill="#1F1F23">Tocou de memória</text><text x="270" y="384" font-size="19" fill="#5B5B66">de primeira, sem dica</text><text x="90" y="418" font-size="19" font-weight="600" fill="#34C759">Errar nunca tira estrela. O ritmo fica à parte.</text><rect x="660" y="120" width="560" height="300" rx="24" fill="#fff" stroke="#E2DED6" stroke-width="2"/><text x="690" y="168" font-size="26" font-weight="800" fill="#1F1F23">Abrir a próxima lição</text><circle cx="720" cy="230" r="27" fill="#34C759"/><text x="720" y="239" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">1</text><circle cx="794" cy="230" r="27" fill="#34C759"/><text x="794" y="239" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">2</text><circle cx="868" cy="230" r="27" fill="#34C759"/><text x="868" y="239" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">3</text><circle cx="942" cy="230" r="27" fill="#F5A524"/><text x="942" y="239" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">4</text><circle cx="1016" cy="230" r="27" fill="#E4E0D8"/><text x="1016" y="239" text-anchor="middle" font-size="24" font-weight="800" fill="#9A958C">5</text><circle cx="1090" cy="230" r="27" fill="#E4E0D8"/><text x="1090" y="239" text-anchor="middle" font-size="24" font-weight="800" fill="#9A958C">6</text><circle cx="1164" cy="230" r="27" fill="#E4E0D8"/><text x="1164" y="239" text-anchor="middle" font-size="24" font-weight="800" fill="#9A958C">7</text><circle cx="720" cy="330" r="27" fill="#E4E0D8"/><text x="720" y="339" text-anchor="middle" font-size="24" font-weight="800" fill="#9A958C">8</text><circle cx="794" cy="330" r="27" fill="#E4E0D8"/><text x="794" y="339" text-anchor="middle" font-size="24" font-weight="800" fill="#9A958C">9</text><circle cx="868" cy="330" r="27" fill="#E4E0D8"/><text x="868" y="339" text-anchor="middle" font-size="24" font-weight="800" fill="#9A958C">10</text><circle cx="942" cy="330" r="27" fill="#E4E0D8"/><text x="942" y="339" text-anchor="middle" font-size="24" font-weight="800" fill="#9A958C">11</text><circle cx="1016" cy="330" r="27" fill="#E4E0D8"/><text x="1016" y="339" text-anchor="middle" font-size="24" font-weight="800" fill="#9A958C">12</text><circle cx="1090" cy="330" r="27" fill="#E4E0D8"/><text x="1090" y="339" text-anchor="middle" font-size="24" font-weight="800" fill="#9A958C">♪</text><text x="690" y="382" font-size="20" fill="#3A3A44">2 estrelas abrem a próxima. As 12 abrem a música.</text><rect x="60" y="450" width="1160" height="230" rx="24" fill="#fff" stroke="#E2DED6" stroke-width="2"/><text x="90" y="498" font-size="26" font-weight="800" fill="#1F1F23">Dias seguidos</text><text x="90" y="532" font-size="20" fill="#5B5B66">Toque algo de memória pelo menos uma vez no dia. Um dia sem tocar zera a contagem, as estrelas ficam.</text><rect x="120" y="555" width="120" height="100" rx="18" fill="#FFF1E6" stroke="#FF7A30" stroke-width="3" /><text x="180" y="585" text-anchor="middle" font-size="18" font-weight="700" fill="#5B5B66">seg</text><path d="M 180 595 c 16 16 16 27 9 38 c 14 -4 12 -16 11 -22 c 9 11 5 31 -20 33 c -24 -2 -27 -25 -11 -36 c -2 9 2 14 7 16 c -5 -11 -4 -22 4 -29 z" fill="#FF7A30"/><rect x="275" y="555" width="120" height="100" rx="18" fill="#FFF1E6" stroke="#FF7A30" stroke-width="3" /><text x="335" y="585" text-anchor="middle" font-size="18" font-weight="700" fill="#5B5B66">ter</text><path d="M 335 595 c 16 16 16 27 9 38 c 14 -4 12 -16 11 -22 c 9 11 5 31 -20 33 c -24 -2 -27 -25 -11 -36 c -2 9 2 14 7 16 c -5 -11 -4 -22 4 -29 z" fill="#FF7A30"/><rect x="430" y="555" width="120" height="100" rx="18" fill="#FFF1E6" stroke="#FF7A30" stroke-width="3" /><text x="490" y="585" text-anchor="middle" font-size="18" font-weight="700" fill="#5B5B66">qua</text><path d="M 490 595 c 16 16 16 27 9 38 c 14 -4 12 -16 11 -22 c 9 11 5 31 -20 33 c -24 -2 -27 -25 -11 -36 c -2 9 2 14 7 16 c -5 -11 -4 -22 4 -29 z" fill="#FF7A30"/><rect x="585" y="555" width="120" height="100" rx="18" fill="#F3F1EC" stroke="#DAD6CE" stroke-width="3" /><text x="645" y="585" text-anchor="middle" font-size="18" font-weight="700" fill="#5B5B66">qui</text><text x="645" y="632" text-anchor="middle" font-size="22" fill="#9A958C">zerou</text><rect x="740" y="555" width="120" height="100" rx="18" fill="#FFF1E6" stroke="#FF7A30" stroke-width="3" /><text x="800" y="585" text-anchor="middle" font-size="18" font-weight="700" fill="#5B5B66">sex</text><path d="M 800 595 c 16 16 16 27 9 38 c 14 -4 12 -16 11 -22 c 9 11 5 31 -20 33 c -24 -2 -27 -25 -11 -36 c -2 9 2 14 7 16 c -5 -11 -4 -22 4 -29 z" fill="#FF7A30"/><rect x="895" y="555" width="120" height="100" rx="18" fill="#FFF1E6" stroke="#FF7A30" stroke-width="3" /><text x="955" y="585" text-anchor="middle" font-size="18" font-weight="700" fill="#5B5B66">sáb</text><path d="M 955 595 c 16 16 16 27 9 38 c 14 -4 12 -16 11 -22 c 9 11 5 31 -20 33 c -24 -2 -27 -25 -11 -36 c -2 9 2 14 7 16 c -5 -11 -4 -22 4 -29 z" fill="#FF7A30"/><rect x="1050" y="555" width="120" height="100" rx="18" fill="#fff" stroke="#DAD6CE" stroke-width="3" stroke-dasharray="8 6"/><text x="1110" y="585" text-anchor="middle" font-size="18" font-weight="700" fill="#5B5B66">dom</text><text x="1110" y="632" text-anchor="middle" font-size="22" fill="#9A958C">hoje?</text>
</svg>
